<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us - Webora</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;

        /* Animated gradient background */
        background: linear-gradient(-45deg, #667eea, #764ba2, #ff758c, #42e695);
        background-size: 400% 400%;
        animation: gradientMove 15s ease infinite;
    }

    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .card {
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.08);
        padding: 60px;
        border-radius: 25px;
        color: white;
        max-width: 600px;
        width: 90%;
        box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    h1 {
        font-size: 56px;
        margin-bottom: 20px;
    }

    p {
        font-size: 16px;
        line-height: 1.7;
        opacity: 0.9;
    }

    .info {
        margin-top: 40px;
        padding-top: 30px;
        border-top: 1px solid rgba(255,255,255,0.2);
    }

    .info p {
        margin-bottom: 15px;
        font-weight: 500;
    }

    .contact-button {
        margin-top: 30px;
        display: inline-block;
        padding: 14px 28px;
        border-radius: 12px;
        background: white;
        color: #333;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s ease;
    }

    .contact-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    @media (max-width: 600px) {
        .card {
            padding: 40px;
        }

        h1 {
            font-size: 40px;
        }
    }

</style>
</head>

<body>

<div class="card">
    <h1>Contact Us</h1>

    <p>
        Vi är activa på eftermidagar och på helgar, va väligen och skicka er bästelning på gmail så vi kan ta det vidare och delivera till er,
        <br>MVH WEBORA
    </p>

    <div class="info">
        <p>Email: example@gmail.com</p>
    </div>

    <a href="mailto:example@gmail.com" class="contact-button">
        Send Email
    </a>
</div>

</body>
</html>
