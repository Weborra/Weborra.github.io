<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Webora</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;

        /* Animated gradient background */
        background: linear-gradient(-45deg, #667eea, #764ba2, #ff758c, #42e695);
        background-size: 400% 400%;
        animation: gradientMove 15s ease infinite;
    }

    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .container {
        width: 90%;
        max-width: 1200px;
        height: 80vh;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 80px;
    }

    /* LEFT SIDE */
    .left {
        max-width: 450px;
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.08);
        padding: 40px;
        border-radius: 20px;
        color: white;
    }

    .left h1 {
        font-size: 64px;
        font-weight: 800;
    }

    .left p {
        margin-top: 20px;
        font-size: 16px;
        line-height: 1.6;
        opacity: 0.9;
    }

    .left button {
        margin-top: 20px;
        width: 100%;
        padding: 14px;
        font-size: 16px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        background: white;
        color: #333;
        font-weight: bold;
        transition: 0.3s ease;
    }

    .left button:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    /* RIGHT SIDE */
    .right {
        position: relative;
        width: 320px;
        height: 320px;
    }

    .paper {
        position: absolute;
        width: 220px;
        height: 280px;
        border-radius: 8px;
        background: linear-gradient(135deg, #ffffff, #e6e6e6);
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        transform-origin: center;
        transition: 0.4s ease;
    }

    .paper.one {
        transform: rotate(-45deg);
        top: 0;
        left: 60px;
        z-index: 3;
    }

    .paper.two {
        transform: rotate(-40deg);
        top: 25px;
        left: 35px;
        z-index: 2;
        opacity: 0.9;
    }

    .paper.three {
        transform: rotate(-35deg);
        top: 50px;
        left: 10px;
        z-index: 1;
        opacity: 0.8;
    }

    .right:hover .paper.one {
        transform: rotate(-40deg) translateY(-10px);
    }

    .right:hover .paper.two {
        transform: rotate(-35deg) translateY(-5px);
    }

    .right:hover .paper.three {
        transform: rotate(-30deg);
    }

    @media (max-width: 900px) {
        .container {
            flex-direction: column;
            text-align: center;
            padding: 40px;
        }

        .right {
            margin-top: 60px;
        }
    }

</style>
</head>

<body>

<div class="container">
    <div class="left">
        <h1>Webora</h1>
        <p>
            Du kan se några av våra webbplatsmallar nedan; det är skräddarsydda 
            webbplatser som vi har designat för kunder.
        </p>

        <button onclick="goToView()">View</button>
        <button onclick="goToContact()">Contact Us</button>
    </div>

    <div class="right">
        <div class="paper one"></div>
        <div class="paper two"></div>
        <div class="paper three"></div>
    </div>
</div>

<script>
    function goToView() {
        window.location.href = "view.html";
    }

    function goToContact() {
        window.location.href = "contact.html";
    }
</script>

</body>
</html>
